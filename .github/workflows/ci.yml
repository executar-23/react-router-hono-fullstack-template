name: Local preview checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Built-in Node modules only: no npm ci, env, secrets or Cloudflare resources.
      - run: npm run check


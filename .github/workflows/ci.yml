name: Local preview and Wrangler checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O preview permanece independente de npm ci, env e recursos externos.
      - name: Check application and deployment assets
        run: npm run check
      # Apenas o CLI Wrangler fixado é baixado; dry-run não publica nem exige bindings.
      - name: Validate real Wrangler packaging
        run: npm run check:wrangler

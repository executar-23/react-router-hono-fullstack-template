name: Local preview and Wrangler checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check domain, assets and local UI
        run: npm run check
      - name: Validate real Wrangler packaging
        run: npm run check:wrangler
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Dependencies below are isolated QA tooling. The preview still needs only Node/Python.
      - name: Build static preview
        run: npm run build
      - name: Install browser QA tooling
        run: |
          npm install --prefix .qa-runtime --no-audit --no-fund --package-lock=false playwright@1.56.1
          .qa-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify editorial UI in Chromium
        run: node scripts/check-editorial-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-ui-verification
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 14

 const pos=new Map();let cursor=24;function layout(n,depth){const cs=children(n.id).filter(c=>allowed.has(c.id));let cross;if(cs.length){const vals=cs.map(c=>layout(c,depth+1));cross=(vals[0]+vals.at(-1))/2}else{cross=cursor;cursor+=state.direction==='LR'?244:320}pos.set(n.id,state.direction==='LR'?{x:24+depth*344,y:cross}:{x:cross,y:24+depth*272});return cross}roots.forEach(x=>layout(x.n,0));let w=0,h=0;pos.forEach(p=>{w=Math.max(w,p.x+310);h=Math.max(h,p.y+234)});const edges=state.graph.edges.filter(e=>pos.has(e.source)&&pos.has(e.target));const lines=edges.map(e=>{const a=pos.get(e.source),b=pos.get(e.target),lr=state.direction==='LR';let ax=a.x+(lr?280:140),ay=a.y+(lr?104:208),bx=b.x+(lr?0:140),by=b.y+(lr?104:0);const dep=e.relation==='dependency';return `<path data-component="EXDS-CMP-005" d="M${ax},${ay} C${lr?(ax+bx)/2:ax},${lr?ay:(ay+by)/2} ${lr?(ax+bx)/2:bx},${lr?by:(ay+by)/2} ${bx},${by}" fill="none" stroke="${dep?'var(--accent-primary)':'var(--border-default)'}" stroke-width="${dep?3:1.5}" ${dep?'marker-end="url(#arrow)"':''}/>`}).join('');$('stage').style.width=w*state.zoom+'px';$('stage').style.height=h*state.zoom+'px';$('stage').innerHTML=`<div style="position:absolute;width:${w}px;height:${h}px;transform:scale(${state.zoom});transform-origin:top left"><svg width="${w}" height="${h}" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--accent-primary)"/></marker></defs>${lines}</svg>${visible.map(({n})=>{const p=pos.get(n.id),phase=state.graph.nodes.filter(x=>state.meta[x.id].scope==='phase').findIndex(x=>x.id===state.meta[n.id].phase),cs=children(n.id);return `<article data-component="EXDS-CMP-002" class="node ${n.kind==='root'?'root':''} ${state.selected===n.id?'selected':''}" style="left:${p.x}px;top:${p.y}px;--branch-color:${colors[Math.max(0,phase)%colors.length]}"><button class="node-title" data-inspect="${n.id}">${esc(n.title)}</bu function inspect(id,trigger){state.selected=id;state.scope=state.meta[id].scope;save();render();draft=clone(state.graph);draft.selected=id;lastTrigger=trigger;dirty=false;const n=byId(id),m=state.meta[id];$('editForm').reset();$('editTitle').value=n.title;$('nodeId').textContent=id+' · '+date(m.start)+' a '+date(m.due);$('editOwner').value=n.owner||'';$('editStatus').innerHTML=Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('editStatus').value=effective(n);$('editDescription').value=n.description||'';$('editNotes').value=m.notes;$('editEvidence').value=(n.evidence||[]).join('\n');$('editError').textContent='';renderDependencies();$('inspector').showModal();$('editTitle').focus()}

$('addDependency').onclick=()=>{const source=$('dependencySelect').value;if(!source)return;if(draft.edges.some(e=>e.source===source&&e.target===draft.selected&&e.relation==='dependency'))return;const edge={id:'dep-'+crypto.randomUUID(),source,target:draft.selected,relation:'dependency',label:'FS'};draft.edges.push(edge);try{validate(draft);dirty=true;renderDependencies();$('editError').textContent=''}catch(err){draft.edges.pop();$('editError').textContent=err.message}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.inspect)inspect(b.dataset.inspect,b);if(b.dataset.execute)choose(b.dataset.execute,true);if(b.dataset.collapse){const n=byId(b.dataset.collapse);n.expanded=n.expanded===false;save();renderMap();document.querySelector(`[data-collapse="${n.id}"]`)?.focus()}if(b.dataset.removeEdge){draft.edges=draft.edges.filter(x=>x.id!==b.dataset.removeEdge);dirty=true;renderDependencies()}});

let pan=null;$('canvas').addEventListener('pointerdown',e=>{if(e.target.closest('button,article'))return;pan={x:e.clientX,y:e.clientY,left:$('canvas').scrollLeft,top:$('canvas').scrollTop};$('canvas').setPointerCapture(e.pointerId)});$('canvas').addEventListener('pointermove',e=>{if(pan){$('canvas').scrollLeft=pan.left-e.clientX+pan.x;$('canvas').scrollTop=pan.top-e.clientY+pan.y}});$('canvas').addEventListener('pointerup',()=>pan=null);$('canvas').addEventListener('pointercancel',()=>pan=null);$('canvas').addEventListener('wheel',e=>{if((e.ctrlKey||e.metaKey)&&document.activeElement===$('canvas')){e.preventDefault();state.zoom=Math.max(.25,Math.min(2,state.zoom+(e.deltaY<0?.1:-.1)));renderMap()}},{passive:false});
